<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skyline — Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sky" id="sky"></div>

  <main class="app">
    <header class="app__header">
      <div class="brand">
        <span class="brand__mark">⟡</span>
        <span class="brand__name">Skyline</span>
      </div>

      <form id="searchForm" class="search" autocomplete="off">
        <input
          id="cityInput"
          class="search__input"
          type="text"
          placeholder="Search a city — “Kakinada”, “Tokyo”, “Lisbon”…"
          aria-label="City name"
        />
        <button type="submit" class="search__button" aria-label="Search">
          Look up
        </button>
      </form>
    </header>

    <section id="statusBanner" class="status" hidden></section>

    <section id="dashboard" class="dashboard" hidden>
      <div class="hero">
        <p class="hero__eyebrow" id="heroDate">—</p>
        <h1 class="hero__city" id="heroCity">—</h1>
        <div class="hero__temp-row">
          <span class="hero__temp" id="heroTemp">—</span>
          <span class="hero__unit-toggle">
            <button type="button" class="unit-btn is-active" data-unit="metric" id="unitC">°C</button>
            <span class="unit-sep">/</span>
            <button type="button" class="unit-btn" data-unit="imperial" id="unitF">°F</button>
          </span>
        </div>
        <p class="hero__condition" id="heroCondition">—</p>
        <p class="hero__feels" id="heroFeels">—</p>
      </div>

      <div class="glass-icon" id="conditionGlyph" aria-hidden="true"></div>

      <div class="stat-strip">
        <div class="stat">
          <span class="stat__label">Humidity</span>
          <span class="stat__value" id="statHumidity">—</span>
        </div>
        <div class="stat">
          <span class="stat__label">Wind</span>
          <span class="stat__value" id="statWind">—</span>
        </div>
        <div class="stat">
          <span class="stat__label">Pressure</span>
          <span class="stat__value" id="statPressure">—</span>
        </div>
        <div class="stat">
          <span class="stat__label">Visibility</span>
          <span class="stat__value" id="statVisibility">—</span>
        </div>
        <div class="stat">
          <span class="stat__label">Sunrise</span>
          <span class="stat__value" id="statSunrise">—</span>
        </div>
        <div class="stat">
          <span class="stat__label">Sunset</span>
          <span class="stat__value" id="statSunset">—</span>
        </div>
      </div>
    </section>

    <section id="emptyState" class="empty">
      <p class="empty__glyph">⟡</p>
      <p class="empty__title">No city yet</p>
      <p class="empty__body">Search any city above to pull real-time temperature, humidity, wind, and sky conditions from OpenWeather.</p>
    </section>

    <footer class="app__footer">
      <span>Data from OpenWeather</span>
      <span class="app__footer-dot">·</span>
      <span id="lastUpdated">Not updated yet</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
